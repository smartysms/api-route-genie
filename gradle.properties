org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The IDE provides the Kotlin stdlib at runtime, so it must not end up in the plugin zip.
kotlin.stdlib.default.dependency=false

# --- Branding: the single place to rename the product -------------------------------------------------------
# After changing these, run `./gradlew syncDocs` to update README.md, CHANGELOG.md and docs/*.md as well.
productName=API Route Genie
productShortName=Route Genie
productDir=.route-genie
artifactName=api-route-genie
repoSlug=smartysms/api-route-genie
# -----------------------------------------------------------------------------------------------------------

# PyCharm to build and test against; downloaded from JetBrains unless a local IDE is configured.
platformVersion=2026.2.3

# To build against an IDE you already have installed (faster, no download), set platformPath OUTSIDE the repo,
# in ~/.gradle/gradle.properties (Windows: %USERPROFILE%\.gradle\gradle.properties), or pass it on the command line:
#   platformPath=C:/Program Files/JetBrains/PyCharm
#   ./gradlew build -PplatformPath="C:/Program Files/JetBrains/PyCharm"
